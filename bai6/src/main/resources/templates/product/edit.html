<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Edit</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="container mt-4">

<h2>Edit Product</h2>

<form method="post" action="/products/update">

    <input type="hidden" name="id" th:value="${product.id}">

    <input class="form-control mb-2" name="name" th:value="${product.name}">

    <input class="form-control mb-2" name="price" th:value="${product.price}">

    <select class="form-select mb-2" name="category.id">
        <option th:each="c : ${categories}"
                th:value="${c.id}"
                th:text="${c.name}"
                th:selected="${c.id == product.category.id}">
        </option>
    </select>

    <button class="btn btn-primary">Update</button>
</form>

</body>
</html>
